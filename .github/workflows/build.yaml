# Cross-compiles and publishes release assets, named to match what the
# generated `update` command looks for. Triggered by a VERSION change so a
# release is deliberate - but tests run on every push and PR, or a CLI repo
# would only ever be tested at release time.
name: nvdiff

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      # make test, not the commands themselves: the Makefile says it
      # runs "what CI runs", and that is only true if this IS it. Two
      # copies of the same command drift, and the one that drifts is
      # whichever nobody is looking at.
      - name: Test
        run: make test

      - name: Build
        run: make build

  release:
    # Only when VERSION changed, and only from main. A manual run forces it.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # grep -qx against the full path. A bare `VERSION` never matches
      # in a monorepo, where the file is services/<name>/VERSION - so the
      # gate stayed closed forever and no release could be cut, silently,
      # because a gate that does not open looks the same as a commit that
      # did not bump the version.
      #
      # A first commit has no HEAD~1, so the diff fails and reads as
      # "unchanged"; it introduces VERSION, so count it. A manual run forces
      # a release.
      - name: Release only on a VERSION change
        id: gate
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            echo "go=true" >> $GITHUB_OUTPUT
          elif ! git rev-parse --verify --quiet HEAD~1 >/dev/null; then
            echo "go=true" >> $GITHUB_OUTPUT
          elif git diff --name-only HEAD~1 HEAD | grep -qx 'VERSION'; then
            echo "go=true" >> $GITHUB_OUTPUT
          else
            echo "go=false" >> $GITHUB_OUTPUT
          fi

      - uses: actions/setup-go@v5
        if: steps.gate.outputs.go == 'true'
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: Read version
        if: steps.gate.outputs.go == 'true'
        id: v
        run: echo "version=$(head -n1 VERSION)" >> $GITHUB_OUTPUT

      # Asset names must match what `nvdiff update` looks for:
      # nvdiff_<goos>_<goarch>.tar.gz containing the bare binary.
      # Version is injected here; without it a released binary reports
      # "dev" and refuses to update itself.
      - name: Cross-compile
        if: steps.gate.outputs.go == 'true'
        run: |
          VERSION="${{ steps.v.outputs.version }}"
          LDFLAGS="-s -w -X main.Version=$VERSION"
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64; do
            GOOS="${target%/*}"; GOARCH="${target#*/}"
            mkdir -p "dist/$GOOS/$GOARCH"
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build -ldflags "$LDFLAGS" -o "dist/$GOOS/$GOARCH/nvdiff" .
            tar -czf "nvdiff_${GOOS}_${GOARCH}.tar.gz" -C "dist/$GOOS/$GOARCH" "nvdiff"
          done
          sha256sum nvdiff_*.tar.gz > checksums.txt

      - uses: softprops/action-gh-release@v2
        if: steps.gate.outputs.go == 'true'
        with:
          # Prefixed in a monorepo, because releases are per REPOSITORY
          # and the siblings each cut their own. Sharing one namespace
          # made `latest` mean "whichever service released last", and
          # two services reaching the same number attached their assets
          # to ONE release where the second checksums.txt overwrote the
          # first. A dedicated repo has one release line, so no prefix.
          tag_name: ${{ steps.v.outputs.version }}
          files: |
            nvdiff_*.tar.gz
            checksums.txt
